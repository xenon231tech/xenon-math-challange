name: Greetings - Welcome Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: |
          # 🎉 Thank you for opening your first issue!
          
          Hi @${{ github.actor }}, welcome to Math Challenge!
          
          ✅ Make sure to check:
          - [FAQ.md](https://github.com/xenon231tech/math-game/blob/main/FAQ.md)
          - [TODO.md](https://github.com/xenon231tech/math-game/blob/main/TODO.md)
          - [Existing issues](https://github.com/xenon231tech/math-game/issues)
          
          🔗 [🌐 Play the game](https://xenon-math-challenge.vercel.app)
          
          *✅ Diverifikasi Nova Core (Billions TEE)*
          
        pr-message: |
          # 🚀 Thank you for your first pull request!
          
          Hi @${{ github.actor }}, thank you for contributing to Math Challenge!
          
          📋 Our team will review your PR within 24-48 hours.
          
          ### Checklist before review:
          - [ ] Changes tested locally
          - [ ] Billions TEE proof still works
          - [ ] Documentation updated (if needed)
          
          🔗 [🌐 Play the game](https://xenon-math-challenge.vercel.app)
          
          *✅ Diverifikasi Nova Core (Billions TEE)*
